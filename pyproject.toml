[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocqkudsin"
version = "0.1.0"
description = "Small-system circuit implementation of OCQKUDSIN"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pennylane>=0.36",
]

[project.optional-dependencies]
fe2s = [
    "pyscf>=2.0",
    "basis-set-exchange>=0.9",
]

[tool.setuptools]
py-modules = ["ocqkudsin"]
