[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cqkud"
version = "0.1.0"
description = "Small-system circuit implementation of OCQKUD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pennylane>=0.36",
]

[tool.setuptools]
py-modules = ["ocqkud"]
